[pytest]
# Directory where pytest will search for tests
testpaths = test_cases

# Add current directory to Python path so imports like "from pages.login_page import LoginPage" work seamlessly
pythonpath = .

# Default command-line flags:
# -v: verbose output (displays each test name and PASS/FAIL status)
# -s: allows print statements to show up in the terminal
# --html=report.html: automatically generates a visual HTML test report
addopts = -v -s --html=report.html --self-contained-html

# Custom markers for organizing and running test categories (e.g., pytest -m smoke)
markers =
    smoke: Quick sanity check tests (e.g. valid login)
    regression: Full test suite covering all flows
    negative: Negative/error validation test cases
    idempotency: True idempotency and duplicate transfer tests
